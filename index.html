<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORA | لوحة الإدارة</title><style>body{font-family:Arial;background:#f6f4f1;margin:0}.wrap{max-width:900px;margin:auto;padding:25px}.card{background:white;padding:20px;border-radius:18px;margin:15px 0}input,button{padding:11px;border-radius:9px;border:1px solid #ddd;margin:5px}button{cursor:pointer;background:#202020;color:#fff}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px}</style></head><body><div class="wrap"><h1>LORA — لوحة الإدارة</h1><div class="card"><h2>إضافة منتج</h2><input id="name" placeholder="اسم المنتج"><input id="price" type="number" placeholder="السعر"><input id="icon" placeholder="رمز/إيموجي"><input id="desc" placeholder="الوصف"><button onclick="add()">إضافة</button></div><div class="card"><h2>المنتجات</h2><div id="list"></div></div><div class="card"><h2>رقم واتساب المتجر</h2><p>افتح ملف script.js واستبدل YOUR_WHATSAPP_NUMBER برقمك مع رمز الدولة بدون +.</p></div><a href="../">← العودة للمتجر</a></div><script>let p=JSON.parse(localStorage.getItem("lora_products")||"null")||[];function show(){document.getElementById("list").innerHTML=p.map((x,i)=>`<div class=item><span>${x.icon||"🛍️"} ${x.name} — $${x.price}</span><button onclick="del(${i})">حذف</button></div>`).join("")}function add(){let n=name.value.trim(),pr=price.value,ic=icon.value||"🛍️",d=desc.value||"";if(!n||!pr)return alert("أدخل الاسم والسعر");p.push({id:Date.now(),name:n,price:Number(pr),icon:ic,desc:d});localStorage.setItem("lora_products",JSON.stringify(p));show()}function del(i){p.splice(i,1);localStorage.setItem("lora_products",JSON.stringify(p));show()}show()</script></body></html>
